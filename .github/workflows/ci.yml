name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Source checks and tooling tests run on public AND private repositories.
# They consume runner time; only the more expensive jobs retain the opt-in
# gate for private repositories. ENABLE_CI enables those jobs, while Lean
# additionally requires ENABLE_LEAN. Local hooks are not a CI substitute.
permissions:
  contents: read

jobs:
  source-checks:
    name: source checks and tooling regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check sources and regression tests (no TeX or Lean)
        run: make check-source test

  manuscript:
    name: manuscript and checks
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.repository.private == false
      || vars.ENABLE_CI == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended latexmk

      # Build the six PDFs, run source/log checks and regression tests.
      - name: Build and check
        run: make all

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: output/pdf/
          if-no-files-found: error

  tools:
    name: computational smoke tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.repository.private == false
      || vars.ENABLE_CI == 'true'
    steps:
      - uses: actions/checkout@v5
      # Every program exits non-zero on failure and prints a pass/fail line.
      - name: Build and smoke-test
        run: make smoke CXXFLAGS='-O2 -std=c++17 -Wall'

  formal:
    name: lean
    runs-on: ubuntu-latest
    # Opt-in twice over: the gate above, and ENABLE_LEAN, because a first
    # mathlib build downloads several gigabytes.
    if: >-
      (github.event_name == 'workflow_dispatch'
       || github.event.repository.private == false
       || vars.ENABLE_CI == 'true')
      && vars.ENABLE_LEAN == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build
